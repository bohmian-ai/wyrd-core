[package]
name = "wyrd-tonic"
version = { workspace = true }
# Pinned to 2021 to match the source crate (wyrd-bifrost-oracle and surfaces both
# keep wyrd-tonic on edition 2021). The extraction preserves source editions
# rather than migrating code to edition 2024, keeping the port behavior-faithful.
edition = "2021"
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
description = "Wyrd-owned tonic facade: single pin point for all tonic-family versions and generated gRPC stubs."

# tonic's default features pull `transport` → `server` → `router` → axum. We take
# only the client-safe surface here so client-tier consumers (wyrd-client) never
# inherit the server stack; the `server` feature below opts back into `tonic/server`.
[dependencies]
tonic = { workspace = true, features = ["channel", "tls-aws-lc", "tls-native-roots"] }
tonic-prost = { workspace = true }
tonic-types = { workspace = true }
prost = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-tls = { workspace = true }
serde_json = { workspace = true }
arc-swap = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-stream = { version = "0.1", features = ["net"] }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[dependencies.tonic-health]
workspace = true
optional = true

[dependencies.tonic-reflection]
workspace = true
optional = true

# OTLP collector proto surface (server-side tonic codegen). Gated behind the
# `server` feature so the client tier stays axum-free.
[dependencies.opentelemetry-proto]
workspace = true
optional = true

[build-dependencies]
tonic-prost-build = { workspace = true }

[features]
default = []
server = ["dep:tonic-reflection", "dep:tonic-health", "tonic/server", "tonic/router", "dep:opentelemetry-proto"]
# Marker feature: opts the generated `wyrd::v1` client stub into codegen (see
# build.rs). No extra tonic surface needed — the client rides the default
# `channel` transport already enabled above.
client = []
