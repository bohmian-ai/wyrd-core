[package]
name = "wyrd-dev-fixtures"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = "Plane-neutral development fixture primitives for Wyrd SQL integration tests."

[features]
default = []
pg = [
    "dep:secrecy",
    "dep:sqlx",
    "dep:thiserror",
    "dep:tokio",
    "dep:url",
    "dep:wyrd-sql-core",
]

[dependencies]
secrecy = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread"] }
url = { workspace = true, optional = true }
wyrd-sql-core = { workspace = true, optional = true }

[dev-dependencies]
# Required by the sql_core_seam compile test (tests/sql_core_seam.rs), which
# imports the complete wyrd-sql-core public API without a pg feature gate.
wyrd-sql-core = { workspace = true }
