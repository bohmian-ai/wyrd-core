[workspace]
# Per-package git tags: <crate>-v<version> (e.g. wyrd-spec-v0.1.0).
# A single global tag is intentionally omitted; each crate is independently
# versioned and tagged so release-plz can track per-crate release state.
git_tag_name = "{{ package }}-v{{ version }}"

# Changelog generation is enabled for every crate in the workspace.
changelog_update = true

# GitHub releases are created when a version PR is merged; no crates.io
# publish is configured here. The `command: release` publish job is added
# by the future publication plan once the 0.1.0 baseline is authorized.
git_release_enable = true
