[workspace]
# Publish only reviewed public crates. GitHub Release publication is the manual
# approval gate; Release-plz does not create an additional tag or release.
dependencies_update = true
changelog_update = true
semver_check = true
publish_timeout = "10m"
git_tag_enable = false
git_release_enable = false
publish = false
repo_url = "https://github.com/bohmian-ai/wyrd-core"

